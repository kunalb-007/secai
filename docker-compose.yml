version: '3.9'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: secai-postgres

    environment:
      POSTGRES_DB: secai
      POSTGRES_USER: secai
      POSTGRES_PASSWORD: secai_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  minio:
    image: minio/minio:latest
    container_name: secai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10

  marker:
    build:
      context: ./marker-service
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - PYTHONUNBUFFERED=1
    # Marker model download happens on first run (~2GB, cached after that)
    volumes:
      - marker_models:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 20     # model loading can take 1-2 min on first start
      start_period: 120s

volumes:
  postgres_data:
  minio_data:
  marker_models:    # persists downloaded Marker model weights