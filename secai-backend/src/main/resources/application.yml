spring:
  application:
    name: secai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/secai}
    username: ${DB_USERNAME:secai}
    password: ${DB_PASSWORD:secai_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway manages schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  # Enable @Async processing
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
      thread-name-prefix: doc-processor-

# JWT config — change secret in production!
app:
  jwt:
    secret: "your-super-secret-key-minimum-256-bits-long-change-this-in-prod"
    expiration-ms: 86400000  # 24 hours

  storage:
    type: minio
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:secai-files}
    region: us-east-1

  openai:
    # GitHub Models free tier: set GITHUB_TOKEN env var
    # Switch to OpenAI: change to ${OPENAI_API_KEY} and update base-url
    api-key: ${GITHUB_TOKEN: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}
    embedding-model: text-embedding-3-small
    embedding-dimensions: 1536
    base-url: ${AI_BASE_URL:https://models.inference.ai.azure.com}
    batch-size: ${AI_BATCH_SIZE:20}
    chat-model: gpt-4o-mini

  processing:
    marker-service-url: ${MARKER_SERVICE_URL:http://localhost:8100}
    max-retries: 1
    chunk-max-tokens: 300
    chunk-overlap-tokens: 50

server:
  port: 8080

logging:
  level:
    com.secai: DEBUG
    org.springframework.security: INFO
